<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmik — Clips</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#07090a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="space"></canvas>
  <div class="grain"></div>
  <div class="vignette"></div>

  <a href="/api/logout" class="back-link">
    <svg viewBox="0 0 24 24" width="14" height="14"><path d="M19 12H5M11 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Exit
  </a>

  <nav class="page-tabs">
    <a href="/home" class="page-tab">Home</a>
    <a href="/projects" class="page-tab">Projects</a>
    <a href="/chat" class="page-tab">Live Stream</a>
    <a href="/clips" class="page-tab is-active">Clips</a>
    <a href="/watching" class="page-tab">Watching</a>
    <a href="/finance" class="page-tab">Finances</a>
    <a href="/storage" class="page-tab">Storage</a>
  </nav>

  <main class="dashboard">
    <div class="dashboard-header">
      <h1 class="dashboard-title">Clips</h1>
      <p class="dashboard-sub">Save your best Twitch and Kick clips, and watch them right here.</p>
    </div>

    <form id="clip-form" class="clips-add" autocomplete="off">
      <input id="clip-url" type="url" placeholder="Paste a Twitch or Kick clip link" aria-label="Clip link" required>
      <input id="clip-name" type="text" maxlength="100" placeholder="Custom name (optional)" aria-label="Custom name">
      <button id="clip-submit" type="submit" class="finance-add-btn">Add clip</button>
    </form>
    <p id="clip-status" class="finance-form-error clips-status"></p>

    <div id="clip-grid" class="clip-grid"></div>
  </main>

  <div id="clip-modal" class="modal-overlay">
    <div class="modal-panel clip-panel">
      <div class="clip-panel-head">
        <h2 id="clip-player-title" class="clip-player-title"></h2>
        <button id="clip-modal-close" class="clip-close" type="button" aria-label="Close clip">✕ Close</button>
      </div>
      <div id="clip-stage"></div>
      <div class="clip-player-links">
        <span id="clip-player-meta"></span>
        <a id="clip-player-link" href="#" target="_blank" rel="noopener">Open original ↗</a>
      </div>
    </div>
  </div>

  <script src="background.js"></script>
  <script src="hls.min.js"></script>
  <script src="clips.js"></script>
</body>
</html>
