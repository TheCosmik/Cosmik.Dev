<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="space"></canvas>
  <div class="grain"></div>
  <div class="vignette"></div>

  <div id="secret-trigger" class="secret-orb" aria-hidden="true"></div>

  <main class="profile">
    <img class="avatar" src="pfp.png" alt="Cosmik">
    <h1 class="profile-name">COSMIK</h1>
    <div id="link-list" class="link-list"></div>
  </main>

  <div id="unlock-modal" class="modal-overlay">
    <div class="modal-panel unlock-panel">
      <button id="unlock-close" class="modal-close" aria-label="Close">&times;</button>
      <form id="unlock-form" autocomplete="off">
        <input id="unlock-password" type="password" name="password" placeholder="Access code" spellcheck="false">
        <button type="submit">
          Enter
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <p id="unlock-message" class="gate-message"></p>
      </form>
    </div>
  </div>

  <script src="background.js"></script>
  <script src="links.js"></script>
  <script src="app.js"></script>
</body>
</html>
