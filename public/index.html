<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex Harrington</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="space"></canvas>
  <div class="grain"></div>
  <div class="vignette"></div>

  <main class="gate">
    <div class="gate-mark">
      <h1 class="gate-name">Alex Harrington</h1>
      <p class="gate-sub">Private workspace</p>
    </div>
    <form id="gate-form" class="panel" autocomplete="off">
      <input id="password" type="password" name="password" placeholder="Access code" spellcheck="false" autofocus>
      <button type="submit" aria-label="Submit">
        Enter
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <p id="gate-message" class="gate-message"></p>
    </form>
  </main>

  <script src="background.js"></script>
  <script src="app.js"></script>
</body>
</html>
