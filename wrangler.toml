name = "cosmikdev"
main = "worker/index.js"
compatibility_date = "2026-09-13"
workers_dev = true

routes = [
  { pattern = "cosmik.dev", custom_domain = true },
  { pattern = "www.cosmik.dev", custom_domain = true }
]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[[kv_namespaces]]
binding = "COSMIK_KV"
id = "696129bec3a449b4be2b737dd8364f4f"

# R2 bucket binding — uncomment once the bucket exists (see storage setup steps):
# [[r2_buckets]]
# binding = "STORAGE_BUCKET"
# bucket_name = "cosmikdev-storage"

[[durable_objects.bindings]]
name = "TWITCH_SOCKET"
class_name = "TwitchChatSocket"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[durable_objects.bindings]]
name = "FINANCE_STORE"
class_name = "FinanceStore"

[[durable_objects.bindings]]
name = "STORAGE_INDEX"
class_name = "StorageIndex"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TwitchChatSocket"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ChatRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["FinanceStore"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["StorageIndex"]

[triggers]
crons = ["*/5 * * * *"]

[vars]
STORAGE_LIMIT_GB = "100"
R2_ACCOUNT_ID = "67c33331176ac315225c7f48175ec1cd"
R2_BUCKET_NAME = "cosmikdev-storage"
